name: Publish support pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/privacy-policy.md
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare privacy policy
        run: |
          mkdir -p .pages-source/privacy
          cp -R site/. .pages-source/
          printf '%s\n' \
            '---' \
            'layout: default' \
            'title: Privacy policy' \
            'description: Privacy policy for the Tip Tracker iOS app.' \
            'permalink: /privacy/' \
            '---' \
            '' > .pages-source/privacy/index.md
          tail -n +2 docs/privacy-policy.md >> .pages-source/privacy/index.md

      - name: Build pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Upload pages
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
